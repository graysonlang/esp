name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Active LTS, pinned rather than matrixed: this job publishes an
          # artifact, so it wants one reproducible build, not coverage.
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # `npm ci` so a published page is built from exactly the committed tree.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Runs esbuild with --lint --minify, so this gates on biome too. Output
      # goes to www/ (the `outdir` in scripts/build.mjs) — keep the upload path
      # below in step with it.
      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: www
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
